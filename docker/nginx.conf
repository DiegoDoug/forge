server {
    listen 80;
    server_name _;

    client_max_body_size 220m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Phase 11 (Claude MCP / Second Brain). Two blocks (exact + prefix) so
    # both a bare "/mcp" and "/mcp/..." resolve to the backend's "/mcp/"
    # mount without ever emitting a redirect - the backend's Mount issues a
    # 307 from "/mcp" to "/mcp/" internally, and an MCP HTTP client is not
    # guaranteed to follow a 307 on a POST request, so nginx normalizes this
    # instead of relying on redirect-following. Returns 404 (from the
    # backend itself, since the app is only mounted when FORGE_MCP_ENABLED is
    # true) rather than being silently absent when MCP is disabled - no
    # special-casing needed here for the disabled case. proxy_buffering off
    # and a long read timeout: Streamable HTTP responses can be SSE-framed
    # and the connection can be long-lived; nginx's default 60s read timeout
    # and buffering would otherwise cut a session short or delay delivery.
    location = /mcp {
        proxy_pass http://backend:8000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /mcp/ {
        proxy_pass http://backend:8000/mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
